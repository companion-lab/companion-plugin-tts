[package]
name = "tts-backend"
version = "0.1.0"
description = "TTS (speech synthesis) feature plugin backend for companion-tauri (Supertonic ONNX)"
license = "MIT"
edition = "2021"

[lib]
name = "tts_backend"
crate-type = ["cdylib"]

[dependencies]
companion-plugin-sdk = { path = "../../sdk/rust/companion-plugin-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Engine dependencies mirror app/src-tauri/Cargo.toml exactly (versions and
# features) so the ported tts.rs compiles unchanged.
# ort: the host's Cargo.toml says "2.0.0-rc.7", but its committed Cargo.lock
# (the version it actually builds with) resolves 2.0.0-rc.13, and cargo's
# prerelease resolution of "2.0.0-rc.7" on a fresh lockfile picks rc.15 with
# a mismatched ort-sys (broken pairing). Pinned exactly to the host's
# effective version.
ort = "=2.0.0-rc.13"
ndarray = "0.17"
rand = "0.8"
rand_distr = "0.4"
unicode-normalization = "0.1"
regex = "1.10"
anyhow = "1.0"

[profile.release]
strip = true
