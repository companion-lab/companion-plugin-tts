# Build the plugin into installable .zip packages and publish them.
#
# Every push to main (and manual dispatch) builds a zip per platform and
# uploads it as a workflow artifact for testing. Pushing a v* tag (e.g.
# v0.1.0) additionally publishes a GitHub Release attaching the zips, which
# is what users download and import via the Companion app's
# Settings -> Plugins -> Import plugin...
#
# The zips are built with the published `companion-cli` npm package: it
# bundles the React frontend with esbuild, compiles backend/ with cargo in
# release mode (when the plugin declares a backend), copies assets/, and
# zips only the package files. Backend plugins are platform-specific — one
# zip per matrix platform; frontend-only plugins (no manifest.backend) build
# a single universal zip (the matrix still runs, producing identical files).
#
# Output goes to dist-ci/ so the locally built zips committed under dist/
# are never touched by CI.

name: Build plugin

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a tag build — it publishes the release.
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # No macos-x86_64 leg: ort-sys (pinned =2.0.0-rc.13) has no prebuilt
        # ONNX Runtime for x86_64-apple-darwin, so the backend can't compile
        # for Intel Macs. (The Companion app itself is also arm64-only.)
        include:
          # ubuntu-24.04, never ubuntu-latest: the backend statically embeds
          # onnxruntime, so the runner's glibc/libstdc++ become the .so's
          # permanent symbol-version floor. A floating tag silently raised it
          # past what any Ubuntu LTS ships (v0.3.2 required GLIBC_2.43 and
          # could not load anywhere) — pin to the oldest supported distro.
          - { os: ubuntu-24.04,   platform: linux-x86_64 }
          - { os: macos-15,       platform: macos-arm64 }
          - { os: windows-latest, platform: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Only used when the repo has a pnpm lockfile; harmless otherwise.
      # pnpm 12+ tolerates settings-only pnpm-workspace.yaml files (no
      # `packages` field), which pnpm 9 rejects.
      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install JS dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            # Fall back to a plain install when the committed lockfile has
            # drifted from package.json, so a stale lockfile warns instead
            # of failing the build.
            npm ci || { echo "::warning::package-lock.json out of sync with package.json; fell back to npm install"; npm install; }
          else
            npm install
          fi

      # Backend plugins compile a Rust cdylib; frontend-only plugins have no
      # backend/ and skip these steps.
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ hashFiles('backend/Cargo.toml') != '' }}

      - uses: Swatinem/rust-cache@v2
        if: ${{ hashFiles('backend/Cargo.toml') != '' }}
        with:
          workspaces: backend
          prefix-key: ${{ matrix.platform }}

      # Plugins that bundle models in assets/ (stt, tts) must fetch them
      # before the build copies assets/ into the package. stt names its
      # script download-moonshine-models.sh, tts download-models.sh —
      # hence the glob.
      - name: Download models
        if: ${{ hashFiles('scripts/download-*.sh') != '' }}
        run: pnpm run download:models

      - name: Read plugin manifest
        id: meta
        run: |
          id=$(node -p "require('./manifest.json').id")
          version=$(node -p "require('./manifest.json').version")
          if [ -n "$(node -p "require('./manifest.json').backend ?? ''")" ]; then
            zip_name="$id-$version-${{ matrix.platform }}.zip"
          else
            zip_name="$id-$version.zip"
          fi
          {
            echo "id=$id"
            echo "version=$version"
            echo "zip_name=$zip_name"
          } >> "$GITHUB_OUTPUT"

      - name: Verify tag matches manifest version
        if: ${{ github.ref_type == 'tag' }}
        run: |
          expected="v${{ steps.meta.outputs.version }}"
          if [ "$expected" != "${{ github.ref_name }}" ]; then
            echo "::error::tag ${{ github.ref_name }} does not match manifest.json version ($expected)"
            exit 1
          fi

      # ort-sys rc.13's build script (copy-dylibs) resolves the cargo profile
      # dir as OUT_DIR.ancestors().nth(3) and symlinks/copies the downloaded
      # onnxruntime.dll there, then into sibling examples/ and deps/ dirs.
      # Newer cargo puts build-script output under
      # target/release/build/<pkg>/<hash>/out (was build/<pkg>-<hash>/out), so
      # nth(3) is now target/release/build — and cargo never creates its
      # examples/ or deps/ siblings. On a cold cargo cache the symlink into a
      # missing dir fails and the fallback copy panics with
      # ERROR_PATH_NOT_FOUND. Create both layouts' sibling dirs up front.
      - name: Create output dirs expected by ort-sys build script
        if: runner.os == 'Windows'
        run: |
          mkdir -p backend/target/release/examples backend/target/release/deps
          mkdir -p backend/target/release/build/examples backend/target/release/build/deps

      - name: Build plugin zip
        run: |
          npx --yes companion-cli@latest build . \
            --out dist-ci \
            --name "${{ steps.meta.outputs.zip_name }}"

      # Print the cdylib's shared-library dependencies so a release zip that
      # wouldn't load off the build machine is visible in the run log.
      - name: List backend library dependencies
        if: ${{ hashFiles('backend/Cargo.toml') != '' && runner.os != 'Windows' }}
        run: |
          lib=$(find dist-ci \( -name "*.dylib" -o -name "*.so" \) | head -1)
          if [ -n "$lib" ]; then
            if [ "$(uname -s)" = "Darwin" ]; then
              otool -L "$lib"
            else
              ldd "$lib" || true
            fi
          fi

      # The backend statically embeds onnxruntime, so the build runner's
      # glibc/libstdc++ become the .so's permanent symbol-version floor
      # (DT_NEEDED entries are versioned at link time). A newer runner than
      # the oldest supported distro makes the backend unloadable for every
      # user there — v0.3.2 shipped requiring GLIBC_2.43 (acosf/sinf/…
      # re-versioned in glibc 2.43) and failed dlopen on every Ubuntu.
      # Guard the pin above: fail when the built .so requires anything newer
      # than ubuntu-24.04 ships (GLIBC 2.39, GLIBCXX 3.4.33, CXXABI 1.3.13).
      - name: Check Linux glibc compatibility
        if: ${{ hashFiles('backend/Cargo.toml') != '' && runner.os == 'Linux' }}
        run: |
          zip_path=$(find dist-ci -name "*.zip" | head -1)
          if [ -z "$zip_path" ]; then
            echo "::error::no plugin zip found under dist-ci to check"
            exit 1
          fi
          # companion-cli assembles the package in a temp dir and ships only
          # the zip, so the backend .so has to be pulled out of the archive.
          entry=$(unzip -Z1 "$zip_path" | grep '\.so$' | head -1)
          if [ -z "$entry" ]; then
            echo "::error::$zip_path contains no backend .so to check"
            exit 1
          fi
          lib=$(mktemp)
          unzip -p "$zip_path" "$entry" > "$lib"
          python3 - "$lib" <<'PYEOF'
          import struct, sys

          raw = open(sys.argv[1], "rb").read()
          assert raw[:4] == b"\x7fELF", f"{sys.argv[1]} is not an ELF file"

          e_shoff = struct.unpack_from("<Q", raw, 0x28)[0]
          e_shentsize = struct.unpack_from("<H", raw, 0x3A)[0]
          e_shnum = struct.unpack_from("<H", raw, 0x3C)[0]
          e_shstrndx = struct.unpack_from("<H", raw, 0x3E)[0]
          sections = []
          for i in range(e_shnum):
              vals = struct.unpack_from("<IIQQQQIIQQ", raw, e_shoff + i * e_shentsize)
              sections.append(dict(name=vals[0], offset=vals[4], size=vals[5], link=vals[6], info=vals[7]))
          shstr = sections[e_shstrndx]

          def sname(n):
              end = raw.index(b"\x00", shstr["offset"] + n)
              return raw[shstr["offset"] + n:end].decode()

          secs = {sname(s["name"]): s for s in sections}
          verneed = secs.get(".gnu.version_r")
          dynstr = secs.get(".dynstr")
          if verneed is None or dynstr is None:
              print("no versioned symbol requirements — compatibility OK")
              sys.exit(0)

          def cstr(off):
              end = raw.index(b"\x00", dynstr["offset"] + off)
              return raw[dynstr["offset"] + off:end].decode()

          # (prefix, version) pairs from every VERNEED entry.
          reqs = []
          vn_off = verneed["offset"]
          for _ in range(verneed["info"]):
              _, vn_cnt, _, vn_aux, vn_next = struct.unpack_from("<IHHII", raw, vn_off)
              aux = vn_off + vn_aux
              for _ in range(vn_cnt):
                  _, _, _, vna_name, vna_next = struct.unpack_from("<IHHII", raw, aux)
                  v = cstr(vna_name)
                  prefix, _, ver = v.partition("_")
                  if prefix and ver and ver.replace(".", "").isdigit():
                      reqs.append((prefix, ver))
                  if vna_next == 0:
                      break
                  aux += vna_next
              if vn_next == 0:
                  break
              vn_off += vn_next

          caps = {"GLIBC": (2, 39), "GLIBCXX": (3, 4, 33), "CXXABI": (1, 3, 13)}
          bad = []
          for prefix, ver in reqs:
              if prefix not in caps:
                  continue
              nums = tuple(int(x) for x in ver.split("."))
              if nums > caps[prefix]:
                  bad.append(f"{prefix}_{ver}")
          if bad:
              print(f"::error::{sys.argv[1]} requires symbol versions newer than "
                    f"ubuntu-24.04 ships (GLIBC 2.39 / GLIBCXX 3.4.33 / CXXABI 1.3.13): "
                    f"{', '.join(sorted(set(bad)))}. Build on the pinned older runner.")
              sys.exit(1)
          found = sorted(
              {f"{p}_{v}" for p, v in reqs if p in caps},
              key=lambda s: tuple(int(x) for x in s.split("_")[1].split(".")),
          )
          print(f"glibc compatibility OK — highest required: {found[-1] if found else 'none'}")
          PYEOF

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-zip-${{ matrix.platform }}
          path: dist-ci/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: plugin-zip-*
          merge-multiple: true
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no plugin zips were built"
            exit 1
          fi

          name=$(node -p "require('./manifest.json').name")
          version=$(node -p "require('./manifest.json').version")
          description=$(node -p "require('./manifest.json').description")
          abi=$(node -p "require('./manifest.json').abi")

          {
            echo "## $name $version"
            echo
            echo "$description"
            echo
            echo "Import into the Companion app: **Settings → Plugins → Import plugin…** and pick the zip for your platform."
            echo
            echo "| File | Platform |"
            echo "|---|---|"
            for f in "${files[@]}"; do
              base=$(basename "$f")
              case "$base" in
                *-linux-x86_64.zip)   platform="Linux (Intel/AMD 64-bit)" ;;
                *-macos-arm64.zip)    platform="macOS (Apple Silicon)" ;;
                *-macos-x86_64.zip)   platform="macOS (Intel)" ;;
                *-windows-x86_64.zip) platform="Windows (64-bit)" ;;
                *)                    platform="All platforms (frontend-only)" ;;
              esac
              echo "| \`$base\` | $platform |"
            done
            echo
            echo "Requires a Companion app with plugin ABI $abi."
          } > release-notes.md

          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --title "$name $version" \
            --notes-file release-notes.md \
          || gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
